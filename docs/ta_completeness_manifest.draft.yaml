      COLORECTAL-CANCER. So the run would reach :232-233 and raise
      SystemExit("No signatures found for ta_label='COLORECTAL-CANCER'").

      An AUTOMATABLE step whose input a human must supply is not automatable. The producer command
      is still recorded and still correct -- it is simply not runnable until the signatures exist.

