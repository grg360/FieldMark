# TA completeness manifest — DRAFT r2, 2026-08-31
#
# A PROPOSAL FOR REVIEW. Structural pass: three kinds, per-entry applicability, and a
# depends_on graph where every edge carries the file:line that proves it. Companion findings:
# docs/TA_COMPLETENESS_REPORT_2026-08-31.md (see the Amendment section for the reconciliation
# that produced r2).
#
# Read-only authoring. No producer was run, no billed job invoked, nothing committed.
#
# ─────────────────────────────────────────────────────────────────────────────────────────
# WHAT CHANGED IN r2
#
#   kind:           every entry is now output | input | schema_gap. r1 had only outputs, so
#                   hand-supplied content (curated_ta_concepts, ta_hcpcs_codes) and
#                   new-object-required debt (community_board_nsclc_v1) had nowhere to live.
#   applicability:  the condition under which an artifact is EXPECTED for a given TA. r1 had
#                   no way to say "zero is correct here", so branch-conditional artifacts read
#                   as permanent gaps. Never absent: unconditional artifacts say so.
#   depends_on:     now a list of {upstream, gate, evidence}. gate is hard_fail | degrade |
#                   weight_gated. An edge without evidence was DROPPED, not kept on intuition.
#                   A runner orders work by these; a wrong edge runs a stage against inputs
#                   that are not ready.
#
# ─────────────────────────────────────────────────────────────────────────────────────────
# KINDS
#
#   output      produced by a script or view. A runner can create it.
#   input       a human or upstream process must SUPPLY it. NO RUNNER CAN CREATE IT. Every
#               input records `consumers` with on_missing: hard_fail | silent_degrade and the
#               file:line that proves which. silent_degrade is the dangerous half: the stage
#               exits 0 and the surface goes blank.
#   schema_gap  a new TA requires a NEW DATABASE OBJECT, not new rows. No runner can populate
#               these either, but unlike inputs the fix is DDL, not content. Cross-referenced
#               to scripts/utilities/ta_neutrality_allowlist.tsv so the two lists cannot drift.
#
# GATES
#
#   hard_fail    the consumer refuses to run. Cheap, loud, correct.
#   degrade      the consumer runs and produces thinner output. Cited from the code that
#                explicitly chose to proceed.
#   weight_gated read unconditionally but multiplied by a weight that defaults to 0, so a
#                missing value changes nothing at default settings.
#
# ─────────────────────────────────────────────────────────────────────────────────────────
# COVERAGE QUERIES
#
# EVERY coverage_query READS THE TARGET OBJECT DIRECTLY — never a state file, cache or log.
#
# TEXT-KEY WARNING, MEASURED 2026-08-31 AND NOT THEORETICAL. r1 asserted that
# `lower(col) = :ta_slug` resolves for text-keyed tables, generalising a measurement taken on
# hcp_ai_overviews alone. It is FALSE for hcp_research_themes_v2. Live distinct values:
#
#   hcp_research_themes_v2.therapeutic_area : 'NSCLC' | 'COLORECTAL-CANCER' | 'Atopic Dermatitis'
#   theme_canonical_v1.therapeutic_area     : 'NSCLC' | 'COLORECTAL-CANCER'
#   hcp_ai_overviews.therapeutic_area       : 'NSCLC' | 'colorectal-cancer' | 'atopic-dermatitis'
#   hcp_narratives_v2.therapeutic_area_slug : all registered slugs, lowercase
#   hcp_leadership_evidence.therapeutic_area: 'nsclc'
#
# lower('Atopic Dermatitis') = 'atopic dermatitis', which is not the slug 'atopic-dermatitis'.
# Measured result of r1's own query, by TA:
#
#   slug               research_themes  canonical_themes  ai_overviews
#   nsclc                       10,640                25           598
#   colorectal-cancer            1,120                25            15
#   atopic-dermatitis                0                 0            87   <-- 3,499 rows exist
#   hepatology                       0                 0             0
#
# A checker built on r1 would have reported AD as having zero research themes. Entries below
# carry key_form so the mismatch is visible rather than silently wrong; three text-keyed
# entries are marked coverage_query_unsafe until the key is normalised.

meta:
  authored: 2026-08-31
  revision: r2
  reference_ta: nsclc
  measured_ta: colorectal-cancer
  live_artifacts: 56
  entries: 57            # r1 had 42. +14 objects r1 left unaccounted, +1 (nsclc_trials_surface)
                         # that no relation-based census could see: it is a FUNCTION, found by
                         # reading ta_neutrality_allowlist.tsv rather than by querying pg_class.
  excluded: { superseded: 13, backup: 18 }
  reference_contamination: true
  note: >
    NSCLC IS NOT A CLEAN BASELINE. It carries at least one artifact its own configured model
    does not produce (hcp_scientific_emergence_v1, 16,620 rows written 2026-08-19 while
    RISING_MODEL['nsclc'] = 'momentum'), plus two superseded score tables frozen at May. The
    diff read that surplus as CRC deficit. Any artifact with an applicability condition must
    be evaluated against that condition before its NSCLC/CRC delta means anything. See
    contaminated_reference at the foot of this file.

# ═════════════════════════════════════════════════════════════════════════════════════════
# INPUTS — nothing here has a producer. A runner must STOP and ask a human.
# ═════════════════════════════════════════════════════════════════════════════════════════

# ═════════════════════════════════════════════════════════════════════════════════════════
# MACHINE-READABLE LAYER — everything scripts/ta_completeness.py needs to know.
#
# The checker contains NO slug literal, NO table name, NO producer path and NO threshold.
# Every TA-specific fact lives here. If the checker would need to know something about a TA
# to be correct, it goes in ta_facts, not in Python.
# ═════════════════════════════════════════════════════════════════════════════════════════

registry:
  table: therapeutic_areas
  slug_column: slug
  id_column: id

# coverage_query bind names -> where the value comes from.
binds:
  ta_id:          { from: registry,  column: id }
  ta_slug:        { from: registry,  column: slug }
  themes_tag:     { from: ta_facts,  key: themes_tag }
  specialty_slug: { from: ta_facts,  key: specialty }
  buckets_key:    { from: ta_facts,  key: buckets_key }
  # nullable: NULL is a MEANING here, not a missing value -- "this TA has no contracted depth,
  # so count the whole population". run_count only tolerates NULL for binds declared this way.
  established_rank_cut: { from: ta_facts, key: contracted_established_rank_cut, nullable: true }
  community_basis:      { from: ta_facts, key: contracted_community_basis,      nullable: true }

# Per-TA facts. Every applicability predicate resolves against this table.
#
# LIFECYCLE. A TA that nobody has bought has no contracted narrative depth, so there is no
# honest denominator for "how much of the board should carry a narrative" -- the answer is
# whatever a future contract says. Unsold TAs therefore MEASURE the narrative coverage ratios
# and report them, but carry no threshold on those axes and can never be INSUFFICIENT because
# of them. Selling a TA fixes the depth; the depth becomes the denominator.
#   lifecycle                        unsold | sold
#   contracted_established_rank_cut  when sold: narratives contracted down to rank <= N.
#                                    null when unsold.
#   contracted_community_basis       when sold: the community basis contracted for. null when
#                                    unsold. NOTE: the sold-path denominator for community
#                                    CANNOT BE EXPRESSED YET -- see narratives_community.
ta_facts:
  nsclc:
    rising_model: momentum                # scripts/score/rising_score.py:46
    themes_tag: NSCLC                     # extract_research_themes.py TA_CONFIGS
    buckets_key: NSCLC                    # upper(slug) -- what bucket_themes writes
    has_themes_config: true               # slug present in TA_CONFIGS (:152)
    themes_tag_matches_upper: true        # 'NSCLC' == 'NSCLC' -> G2 runs (pre_g2:519-529)
    specialty: oncology                   # social layer grain
    social_ta_addressable: false          # no TA-grain rows exist or can exist
    pharma_weight_nonzero: false          # --w-pharma default 0.0 (recompute_..._v3.py:415)
    has_congress_ingest: true             # ingest_asco_abstracts.py covers it
    is_visible_in_ui: true
    lifecycle: unsold
    contracted_established_rank_cut: null
    contracted_community_basis: null
  colorectal-cancer:
    rising_model: momentum                # scripts/score/rising_score.py:47
    themes_tag: COLORECTAL-CANCER
    buckets_key: COLORECTAL-CANCER
    has_themes_config: true
    themes_tag_matches_upper: true
    specialty: oncology
    social_ta_addressable: false
    pharma_weight_nonzero: false
    has_congress_ingest: true             # ASCO covers colorectal cancer
    is_visible_in_ui: true
    lifecycle: unsold
    contracted_established_rank_cut: null
    contracted_community_basis: null
  atopic-dermatitis:
    rising_model: emergence_composite     # scripts/score/rising_score.py:48
    themes_tag: Atopic Dermatitis
    buckets_key: ATOPIC-DERMATITIS        # DIVERGES from themes_tag; the known AD defect
    has_themes_config: true
    themes_tag_matches_upper: false       # 'Atopic Dermatitis' != 'ATOPIC-DERMATITIS'
    specialty: dermatology
    social_ta_addressable: false
    pharma_weight_nonzero: false
    has_congress_ingest: false
    is_visible_in_ui: true
    lifecycle: unsold
    contracted_established_rank_cut: null
    contracted_community_basis: null
  hepatology:
    rising_model: null                    # never migrated to the v3 rising pipeline
    themes_tag: null
    buckets_key: null
    has_themes_config: false              # no TA_CONFIGS entry -> argparse rejects it
    themes_tag_matches_upper: false
    specialty: hepatology
    social_ta_addressable: true           # the social layer IS keyed at this grain
    pharma_weight_nonzero: false
    has_congress_ingest: false
    is_visible_in_ui: false               # excluded by the live_therapeutic_areas gate
    lifecycle: unsold
    contracted_established_rank_cut: null
    contracted_community_basis: null

# What each classification means to the checker.
#   gap_eligible: false  -> a zero count is NOT a gap; the entry reports N/A with na_reason.
classification_semantics:
  automatable:            { gap_eligible: true,  plan_group: AUTOMATABLE }
  billed:                 { gap_eligible: true,  plan_group: BILLED }
  founder_gated:          { gap_eligible: true,  plan_group: FOUNDER_GATED }
  blocked:                { gap_eligible: true,  plan_group: NEEDS_DECISION }
  unknown:                { gap_eligible: true,  plan_group: NEEDS_DECISION }
  conditional_gap:        { gap_eligible: true,  plan_group: NEEDS_DECISION }
  schema_gap:             { gap_eligible: true,  plan_group: SCHEMA_GAP }
  superseded:             { gap_eligible: false, plan_group: null, na_reason: "superseded; a zero here is correct" }
  frozen:                 { gap_eligible: false, plan_group: null, na_reason: "deliberately frozen; no longer written" }
  user_generated:         { gap_eligible: false, plan_group: null, na_reason: "accrues from app use; no producer can fill it" }
  not_ta_scoped:          { gap_eligible: false, plan_group: null, na_reason: "not keyed at TA grain; a TA bind can never match" }
  not_applicable_for_crc: { gap_eligible: false, plan_group: null, na_reason: "produced only on a branch this TA does not take" }

# Order the plan prints its groups in. NEEDS_DECISION is not one of the four requested
# groups; it exists because three classifications (blocked, unknown, conditional_gap) are
# real gaps that none of the four describe, and dropping them to fit the shape would hide
# them.
# INSUFFICIENT is last because those artifacts EXIST and are already serving data: a
# top-up is a smaller, later job than a build. GAP work comes first because it unblocks.
plan_group_order: [AUTOMATABLE, BILLED, FOUNDER_GATED, SCHEMA_GAP, NEEDS_DECISION, INSUFFICIENT]

# NOTE ON THE KEY NAME: the edge key is `upstream`, not `on`. YAML 1.1 resolves a bare `on:`
# key to the BOOLEAN true, so every edge silently parsed as {true: <name>} and the checker
# could not read its own graph. Do not rename it back.
#
# Tables every producer may read without it being a per-TA precondition. These exist before any
# TA build and are not artifacts a TA build creates, so modelling them as edges would add a node
# that every producer depends on and that orders nothing. Listed BY NAME, never by wildcard --
# the same discipline ta_neutrality_allowlist.tsv uses, and for the same reason.
substrate_tables:
  - hcps_v2                       # the HCP spine
  - hcps                          # v1 spine, still referenced by scoring_pipeline's v1 branch
  - publications_v2               # the publication corpus
  - publications                  # v1 corpus
  - publication_authors_v2        # authorship links
  - publication_authors           # v1 authorship
  - author_pub_flat               # denormalised authorship, rebuilt in ta_cycle 1c
  - hcp_openalex_authors_v2       # OpenAlex identity links
  - therapeutic_areas             # THE REGISTRY -- validate_ta_neutrality.py:231-235 excludes it
                                  # as "the definition of TA-ness"; an edge to it is meaningless
  - regions                       # global scope config
  - region_countries              # global scope config
  - clinical_trials_v2            # trial mirror, TA-agnostic
  - narrative_prompt_versions     # prompt registry, not a TA artifact
  - msl_hcp_notes                 # user-generated field notes
  - hcp_hcpcs_detail              # CMS claims detail, TA-agnostic
  - pulse_concept_blocklist_v1    # 29 curated homonym exclusions, TA-AGNOSTIC and non-blocking:
                                  # label_pub_themes.py:46 reads it to filter noise concepts, and
                                  # an empty blocklist means no filtering, not a failed run.

# depends_on targets that are NOT manifest entries. Named so the checker can tell an
# untracked upstream from a typo, and so the topological sort does not invent nodes.
external_dependencies:
  - hcp_industry_classification_v1   # TA-agnostic; ta_cycle stage 8e
  - institution_primary_links_v1     # TA-agnostic institution layer
  - social_posts_v2                  # social corpus, specialty-keyed
  - ta_configs_entry                 # a dict literal in extract_research_themes.py, not a table


