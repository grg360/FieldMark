      ingest_asco_abstracts.py does not simply load a CSV. It builds a live lookup from two
      queries (:57-71, read as text -- the file is never imported, see the safety note below):
        hcp_established_ranks_v3 JOIN hcps_v2 WHERE therapeutic_area_id = <NSCLC>
          AND scope_type = 'region' AND scope_value = 'US'
        hcp_rising_star_ranks_v3 JOIN hcps_v2 WHERE therapeutic_area_id = <NSCLC>
          AND us_rank IS NOT NULL
      keyed by hcp_key(first_name, last_name) = "first|last" lowercased, and matches ASCO
      speaker_key(SpeakerDisplayName) built the same way. A lung-track speaker is confirmed
      only when the key matches EXACTLY ONE board HCP (:84-90, `elif len(hits) == 1`);
      multiple matches go to `ambiguous` and are DROPPED.

      So the same CSV yields a different presenter set whenever the NSCLC US established board,
      the NSCLC rising board, or hcps_v2 names change -- which is every board recompute and
      every dedup merge. Note the drift is NOT monotonic: corpus growth can also REMOVE a
      presenter by turning a unique name match into an ambiguous one. 47 -> 51 is that drift,
      measured against a board that had moved since the previous run.

      CONSEQUENCE FOR THIS MANIFEST: the count here is not a build-completeness signal in the
      way every other entry's is. It is a rebuild output whose value is only meaningful
      relative to the board state at the moment it ran.

