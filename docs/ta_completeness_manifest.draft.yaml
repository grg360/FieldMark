      coverage_applies_when: {fact: lifecycle, equals: sold}
      coverage_threshold: 1.00
      coverage_ratified: false
      coverage_basis: >
        The rising board, uncapped and de-duplicated by hcp_id. No contracted depth applies to
        this cohort: the two depths a contract names are the established rank cut and the
        community basis, so a sold TA's rising denominator is still the whole board. hcp_rising_star_ranks_v3 IS the
        board for this cohort -- 149 rows for nsclc, no membership flag needed.
      coverage_threshold_reasoning: >
        No slack, unlike throughput: a board member with no narrative is a user-visible hole in
        a profile, not a retryable row. Observed 0.879 (nsclc) and 1.000 (colorectal-cancer).
        GATED ON LIFECYCLE: both nsclc and colorectal-cancer are unsold today, so this axis
        reports its ratio and carries no threshold. The 1.00 above applies only once a TA is
        sold. NOTE FOR RATIFICATION: this denominator is identical to the throughput one
        because the arm is uncapped, so the two axes can only differ by their thresholds. If you accept
        that, consider collapsing this cohort to a single axis -- I have kept both so the
        cohorts stay symmetrical and so a future cap on 13a is caught.

