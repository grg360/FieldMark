        transient failure -- and 140/140 = 1.000 for colorectal-cancer.
      coverage_covered: "select count(distinct r.hcp_id) from hcp_rising_star_ranks_v3 r where r.therapeutic_area_id = :ta_id and exists (select 1 from hcp_narratives_v2 n where n.hcp_id = r.hcp_id and n.therapeutic_area_slug = :ta_slug and n.cohort = 'rising_star')"
