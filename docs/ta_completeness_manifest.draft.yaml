    correction_2026_09_01: >
      THE r2 COMMAND WAS WRONG AND WOULD NOT HAVE RUN. The entry recorded `--ta <slug>`.
      label_pub_themes.py has NO --ta. Its real signature, read statically from source on
      2026-09-01, is: --ta-id TA_ID (uuid, REQUIRED), --ta-label TA_LABEL (text, REQUIRED),
      --execute (write to DB), plus optional --dry-run/--limit/--version. Passing --ta would have
      died in argparse as an ambiguous prefix of --ta-id and --ta-label.

      WHAT --ta-label MUST BE, decided by the CONSUMER rather than by the TA display name.
      label_pub_themes.py:50-77 loads its signatures with
      "JOIN theme_canonical_v1 tc ON tc.id = s.canonical_id WHERE tc.therapeutic_area = %s"
      on BOTH the concept and keyword paths, and :233 raises
      SystemExit("No signatures found for ta_label=...") when nothing matches. So the label is
      matched against theme_canonical_v1.therapeutic_area, which bucket_themes.py writes as
      upper(slug). That is the new buckets_key fact: for colorectal-cancer the correct value is
      COLORECTAL-CANCER. Measured live 2026-09-01, theme_canonical_v1.therapeutic_area holds
      exactly NSCLC and COLORECTAL-CANCER and nothing else.

      buckets_key, NOT themes_tag, even though the two coincide for both live TAs. They diverge
      for atopic-dermatitis (tag "Atopic Dermatitis" vs upper "ATOPIC-DERMATITIS"), and it is
      bucket_themes that writes theme_canonical_v1, so the bucket side decides. AD has zero
      canonical themes, so it would SystemExit either way -- the correct loud failure.

      ON --execute, which the question asked about specifically: it IS required for anything to
      be written -- the INSERT at :313 is guarded by "if args.execute and payload". But omitting
      it does NOT silently succeed. :216-217 raises SystemExit("Pass --dry-run or --execute.")
      before any work happens. So the feared outcome -- a run that "succeeds" and writes nothing
      -- does not occur here; this script refuses instead. The r2 command would have failed on
      the missing --ta-id/--ta-label first.
    status_2026_08_31: { nsclc: 64155, crc: 0, gap: true }
    note: >
      THE HIGHEST-VALUE UNBLOCK. One unbilled script, never run for CRC, in neither cycle. It
      unblocks hcp_canonical_topic_share_v1, the ledger drawer's PRACTICE layer, which today
      renders its named absence on every CRC row. Both prerequisites are already satisfied for
